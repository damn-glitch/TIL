# TIL Language CI/CD
# Author: Alisher Beisembekov

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check compiler
        run: python -m py_compile src/til.py
      - name: Check version
        run: python src/til.py --version

  test-linux:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          pip install pytest
      - name: Run unit tests (native == Python VM == C VM)
        run: python -m pytest tests/ -v --tb=short
      - name: Run every example natively and on the VM
        run: |
          for f in $(find examples -name '*.til' ! -name math_utils.til); do
            echo "Testing: $f"
            (cd "$(dirname "$f")" && python "$GITHUB_WORKSPACE/src/til.py" run "$(basename "$f")" > /tmp/native.txt)
            (cd "$(dirname "$f")" && python "$GITHUB_WORKSPACE/src/til.py" run --vm "$(basename "$f")" > /tmp/vm.txt)
            cmp /tmp/native.txt /tmp/vm.txt
          done
      - name: Kazakh example
        run: python src/til.py run examples/kazakh/salam.til

  c-vm:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Strict builds (gcc, clang, all profiles)
        run: |
          for cc in gcc clang; do
            make -C vm clean
            make -C vm CC=$cc CFLAGS="-std=c99 -O2 -Wall -Wextra -pedantic -Werror" tilvm small tiny
          done
          for defs in "-DTILVM_NO_STDIO -DTILVM_NO_TIME" "-DTILVM_NO_STDIO -DTILVM_NO_MATH -DTILVM_FLOAT=1" \
                      "-DTILVM_INT_BITS=16 -DTILVM_FLOAT=0 -DTILVM_NO_STDIO"; do
            gcc -std=c99 -Wall -Wextra -pedantic -Werror $defs -c vm/tilvm.c -o /tmp/tilvm.o
          done
      - name: Sanitizers (ASan + UBSan, 4 KB heap - GC stress)
        run: |
          make -C vm check
          python src/til.py build --target vm examples/03_functions.til -o /tmp/f.tbc
          ./vm/tilvm-check /tmp/f.tbc > /dev/null

  cross:
    runs-on: ubuntu-latest
    needs: c-vm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cross toolchains and simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm gcc-avr avr-libc simavr
          pip install pytest
      - name: TIL on ARM Cortex-M (QEMU) and 8-bit AVR (simavr)
        run: TIL_TEST_CROSS=1 python -m pytest tests/test_v3.py -v -k "cortex_m or avr"

  test-macos:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
      - name: Compile examples
        run: |
          for f in examples/[0-9]*.til; do
            echo "Testing: $f"
            python src/til.py run "$f"
          done

  test-windows:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/test_compiler.py -v --tb=short
      - name: Run on the TIL VM (no C compiler needed)
        run: |
          python src/til.py run --vm examples/01_hello.til
          python src/til.py run --vm examples/05_control_flow.til
      - name: Compile hello example
        run: python src/til.py run examples/01_hello.til
