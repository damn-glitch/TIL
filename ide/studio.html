square(n: int) -> int
    return n * n

is_prime(n: int) -> bool
    if n < 2
        return false
    var d = 2
    while d * d <= n
        if n % d == 0
            return false
        d += 1
    return true

let nums = [3, 1, 4, 1, 5, 9, 2, 6]
var total = 0
for n in nums
    total += square(n)
print(f"sum of squares of {nums} = {total}")

var primes = []
for n in 1..=50
    if is_prime(n)
        primes.push(n)
print(f"primes up to 50: {primes}")
print(f"there are {len(primes)} of them")

var counts = {}
for word in "the cat and the hat and the bat".split(" ")
    counts[word] = counts.get_or(word, 0) + 1
for word in counts.keys()
    print(f"{word} x{counts[word]}")

var i = 0
loop
    i += 1
    if i % 2 == 0
        continue
    if i > 9
        break
    print(f"odd: {i}")

# TIL v2.0 - Functions
# Author: Alisher Beisembekov
#
# Run: til run 03_functions.til

# Basic function
add(a: int, b: int) -> int
    return a + b

# No return value
greet(name: str)
    print("Hello, " + name + "!")

# Default parameters
power(base: int, exp: int = 2) -> int
    var result = 1
    for i in 0..exp
        result = result * base
    return result

# Recursive
factorial(n: int) -> int
    if n <= 1
        return 1
    return n * factorial(n - 1)

# Recursive Fibonacci
fib(n: int) -> int
    if n <= 1
        return n
    return fib(n - 1) + fib(n - 2)

main()
    print("=== Basic Function ===")
    print(add(10, 20))
    
    print("")
    print("=== Greeting ===")
    greet("World")
    greet("TIL")
    
    print("")
    print("=== Default Parameters ===")
    print(power(3))
    print(power(2, 10))
    
    print("")
    print("=== Factorial ===")
    print(factorial(5))
    print(factorial(10))
    
    print("")
    print("=== Fibonacci ===")
    for i in 0..10
        print(fib(i))

# TIL v2.0 - Structs and Methods
# Author: Alisher Beisembekov
#
# Run: til run 04_structs.til

struct Point
    x: float
    y: float

impl Point
    new(x: float, y: float) -> Point
        return Point { x: x, y: y }
    
    origin() -> Point
        return Point { x: 0.0, y: 0.0 }
    
    distance(self) -> float
        return sqrt(self.x ** 2 + self.y ** 2)
    
    add(self, other: Point) -> Point
        return Point.new(self.x + other.x, self.y + other.y)
    
    scale(self, factor: float) -> Point
        return Point.new(self.x * factor, self.y * factor)

struct Rectangle
    width: float
    height: float

impl Rectangle
    new(w: float, h: float) -> Rectangle
        return Rectangle { width: w, height: h }
    
    area(self) -> float
        return self.width * self.height
    
    perimeter(self) -> float
        return 2.0 * (self.width + self.height)

struct Person
    name: str
    age: int

impl Person
    new(name: str, age: int) -> Person
        return Person { name: name, age: age }
    
    greet(self)
        print("Hi, I'm " + self.name)
    
    is_adult(self) -> bool
        return self.age >= 18

main()
    print("=== Point ===")
    let p1 = Point.new(3.0, 4.0)
    let p2 = Point.new(1.0, 2.0)
    
    print("P1 distance:")
    print(p1.distance())
    
    let p3 = p1.add(p2)
    print("P1 + P2:")
    print(p3.x)
    print(p3.y)
    
    print("")
    print("=== Rectangle ===")
    let rect = Rectangle.new(10.0, 5.0)
    print("Area:")
    print(rect.area())
    print("Perimeter:")
    print(rect.perimeter())
    
    print("")
    print("=== Person ===")
    let alice = Person.new("Alice", 25)
    alice.greet()
    print("Is adult:")
    print(alice.is_adult())
`},{id:"enums",tags:["types"],file:"06_enums.til",source:`# 06_enums.til
# TIL v2.0 - Enumerations
# Author: Alisher Beisembekov
#
# Run: til run 06_enums.til

enum Color
    Red
    Green
    Blue

enum Direction
    North = 0
    East = 1
    South = 2
    West = 3

enum HttpStatus
    OK = 200
    NotFound = 404
    ServerError = 500

get_status_text(status: HttpStatus) -> str
    if status == HttpStatus.OK
        return "Success"
    elif status == HttpStatus.NotFound
        return "Not Found"
    else
        return "Error"

main()
    print("=== Basic Enum ===")
    let color = Color.Red
    if color == Color.Red
        print("It's red!")
    
    print("")
    print("=== Enum with Values ===")
    print("Direction North:")
    print(Direction.North)
    print("Direction East:")
    print(Direction.East)
    
    print("")
    print("=== HTTP Status ===")
    print("OK status code:")
    print(HttpStatus.OK)
    print("NotFound status code:")
    print(HttpStatus.NotFound)
    
    print("")
    print("=== Status Text ===")
    print(get_status_text(HttpStatus.OK))
    print(get_status_text(HttpStatus.NotFound))
    print(get_status_text(HttpStatus.ServerError))
`},{id:"tour",tags:["language"],file:"09_v3_features.til",source:`# 09_v3_features.til
# TIL 3.0 - a tour of the new language features.
# Run: til run examples/09_v3_features.til      (or: til run --vm ...)

# ── algebraic data types: enum variants that carry data ───────────────
enum Shape
    Circle(float)
    Rect(float, float)
    Dot

area(s: Shape) -> float
    return match s
        Shape.Circle(r) => 3.14159 * r * r
        Shape.Rect(w, h) => w * h
        Shape.Dot => 0.0

# ── traits with default methods + dynamic dispatch ────────────────────
trait Greeter
    name(self) -> str
    greet(self) -> str
        return "Hello, " + self.name() + "!"

struct Student
    first: str

struct Robot
    serial: int

impl Greeter for Student
    name(self) -> str
        return self.first

impl Greeter for Robot
    name(self) -> str
        return f"unit-{self.serial}"
    greet(self) -> str
        return "BEEP. " + self.name() + " ONLINE."

# ── closures are values ───────────────────────────────────────────────
make_multiplier(k: int)
    return |x: int| x * k

# ── Result + \`?\` early return ─────────────────────────────────────────
parse_grade(s: str) -> Result<int, str>
    if s == ""
        return Err("empty input")
    let n = s.to_int()
    if not (0 <= n <= 100)
        return Err(f"{n} is out of range")
    return Ok(n)

curve(s: str) -> Result<int, str>
    let g = parse_grade(s)?
    return Ok(min(g + 10, 100))

# ── retry: really runs the body again after a failure ─────────────────
var attempts = 0

flaky_sensor() -> int
    attempts += 1
    assert attempts >= 3, "sensor warming up"
    return 42

main()
    print("== ADTs ==")
    for s in [Shape.Circle(1.0), Shape.Rect(2.0, 3.5), Shape.Dot]
        print(f"{s} -> area {area(s):.2f}")

    print("== traits ==")
    for g in [Student { first: "Aigerim" }, Robot { serial: 7 }]
        print(g.greet())

    print("== closures & higher-order functions ==")
    let triple = make_multiplier(3)
    let nums = [1, 2, 3, 4, 5, 6]
    print(nums.map(triple))
    print(nums.filter(|n| n % 2 == 0).map(|n| n * n))
    print(nums.reduce(|a, b| a + b, 0))
    print(nums |> len)

    print("== Result and ? ==")
    for input in ["85", "120", ""]
        match curve(input)
            Ok(v) => print(f"curved: {v}")
            Err(e) => print(f"error: {e}")

    print("== maps and strings ==")
    var votes = {}
    for word in "tea coffee tea juice tea coffee".split(" ")
        votes[word] = votes.get_or(word, 0) + 1
    for k in votes
        print(f"{k:<7}{votes[k]:>3}")

    print("== retry / timeout / intent ==")
    let reading = retry(5)
        flaky_sensor()
    print(f"sensor = {reading} after {attempts} attempts")
    let result = timeout(20)
        var i = 0
        loop
            i += 1
        i
    else
        "stopped: " + error
    print(result)
    let msg = retry(1)
        intent "load the class list"
            let classes = ["7A", "7B"]
            classes[5]
    else
        error
    print(msg)
`},{id:"kazakh",tags:["kk"],file:"kazakh.til",source:`# Қазақ тіліндегі кілт сөздер (Kazakh keywords - always available).

қосу(а: int, б: int) -> int
    қайтару а + б

факториал(н: int) -> int
    егер н <= 1
        қайтару 1
    қайтару н * факториал(н - 1)

print("Сәлем, Әлем!")
тұрақты нәтиже = қосу(3, 4)
print(f"3 + 4 = {нәтиже}")

айнымалы қосынды = 0
үшін и ішінде 1..=5
    қосынды += и
print(f"1 + 2 + 3 + 4 + 5 = {қосынды}")

үшін н ішінде 1..=6
    print(f"{н}! = {факториал(н)}")
`},{id:"russian",tags:["ru"],file:"russian.til",source:`#[lang: ru]
# Программа на TIL с русскими ключевыми словами.

функция факториал(н: int) -> int
    если н <= 1
        вернуть 1
    вернуть н * факториал(н - 1)

функция чётное(н: int) -> bool
    вернуть н % 2 == 0

печать("Привет, мир!")
для i в 1..=5
    если чётное(i)
        печать(f"{i} - чётное")
    иначе
        печать(f"{i} - нечётное")

перем счёт = 0
пока счёт < 3
    счёт += 1
печать(f"счёт = {счёт}")
печать(f"10! = {факториал(10)}")

# An empty line ends the game.

is_number(s: str) -> bool
    if len(s) == 0
        return false
    for b in str_bytes(s)
        if b < 48 or b > 57
            return false
    return true

let name = input("What is your name? ")
print(f"Nice to meet you, {name}!")

seed(clock_ms())
let secret = random(1, 100)
var tries = 0
print("I am thinking of a number from 1 to 100.")
loop
    let text = input("Your guess: ").trim()
    if text == ""
        print(f"The number was {secret}. Bye, {name}!")
        break
    if not is_number(text)
        print("Please type a number.")
        continue
    let guess = text.to_int()
    tries += 1
    if guess < secret
        print("Higher!")
    elif guess > secret
        print("Lower!")
    else
        print(f"Yes, {secret}! You needed {tries} tries, {name}.")
        break

`},{id:"verified",tags:["contracts"],file:"10_verified.til",source:`# 10_verified.til
# TIL 3.0 - guarantees checked by the compiler (try breaking them!)
#
#   * effects:      #[pure] / #[effects: ...] are checked against the body
#   * capabilities: only functions holding #[cap: X] (or main) may use X
#   * contracts:    #[requires] with constant arguments is checked at compile time,
#                   otherwise at run time (and failures can be caught with retry)

cap Storage { read, write }

#[pure]
#[requires: b != 0]
safe_div(a: int, b: int) -> int
    return a / b

#[pure]
#[ensures: result >= 0]
abs_diff(a: int, b: int) -> int
    if a > b
        return a - b
    return b - a

#[effects: io]
report(label: str, value: int)
    print(f"{label}: {value}")

#[cap: Storage]
#[effects: io]
save(name: str, value: int)
    print(f"[storage] {name} = {value}")

#[cap: Storage]
#[effects: io]
backup(value: int)
    save("backup", value)      # allowed: backup also holds Storage

main()
    report("10 / 2", safe_div(10, 2))
    report("|3 - 8|", abs_diff(3, 8))
    save("score", 99)          # main holds every capability
    backup(42)

    # A contract violation with a value known only at run time:
    var zero = 0
    let r = retry(1)
        safe_div(1, zero)
    else
        print(error)
        -1
    report("fallback", r)

    # These lines would NOT compile - uncomment one to see the error:
    # report("x", safe_div(1, 0))       error[E-CONTRACT]: breaks #[requires: b != 0]
    # print(abs_diff(1, 2, 3))          error[E-ARITY]
`},{id:"effects",tags:["effects"],file:"12_effects.til",source:`# 12_effects.til
# TIL 3.1 - effect handlers with resumption.
#
# A function *performs* an effect: \`perform Ask("name")\`. The nearest
# \`handle ... with\` around the call (even many calls up) decides what it means.
#   resume(v)  - continue right after the perform, which evaluates to v
#   no resume  - the clause's value becomes the value of the whole handle
# Run: til run examples/12_effects.til   (handlers run on the TIL VM)

# ── 1. ask the caller instead of reading globals ──────────────────────
greet() -> str
    let name = perform Ask("name")
    let city = perform Ask("city")
    perform Log("greeting " + name)
    return f"Hello, {name} from {city}!"

# A top-level function named like the effect is its default handler:
# it runs when no \`handle\` around the perform has a clause for it.
Log(msg: str)
    print("[log] " + msg)

# ── 2. leave a deep computation early ─────────────────────────────────
first_negative(rows) -> int
    for row in rows
        for x in row
            if x < 0
                perform Found(x)
    return 0

# ── 3. generators: the producer yields, the handler consumes ─────────
countdown(n: int)
    var i = n
    while i > 0
        perform Yield(i)
        i -= 1

main()
    print("== ask / log ==")
    let text = handle
        greet()
    with
        Ask(key) =>
            if key == "name"
                resume("Aigerim")
            resume("Almaty")
    print(text)

    print("== early exit ==")
    let neg = handle
        first_negative([[1, 2], [3, -4, 5], [-6]])
    with
        Found(x) => x
    print(f"first negative: {neg}")

    print("== generator ==")
    var squares = []
    handle
        countdown(5)
    with
        Yield(v) =>
            squares.push(v * v)
            resume()
    print(squares)

    print("== state ==")
    var counter = 0
    let total = handle
        for i in 1..=5
            perform Add(i)
        perform Get()
    with
        Add(x) =>
            counter += x
            resume()
        Get => resume(counter * 10)
    print(f"total = {total}")

    print("== nested handlers ==")
    let r = handle
        handle
            perform Log("inner work")
            "done"
        with
            Log(msg) =>
                perform Log("[inner] " + msg)    # goes to the outer handler
                resume()
    with
        Log(msg) =>
            print("[outer] " + msg)
            resume()
    print(r)

    print("== effects + retry ==")
    var calls = 0
    let reading = handle
        retry(3)
            perform Sensor()
        else
            -1
    with
        Sensor() =>
            calls += 1
            if calls < 3
                panic("sensor busy")
            resume(42)
    print(f"sensor = {reading} after {calls} calls")
`},{id:"proofs",tags:["proofs"],file:"13_proofs.til",source:`# 13_proofs.til
# TIL 3.1 - contracts proved for ALL inputs, not only the ones you test
#
#   til run 13_proofs.til       contracts are checked while the program runs
#   til prove 13_proofs.til     Z3 proves them for every possible input
#   til check 13_proofs.til     proves the #[level: 4] functions
#
# Ints are 64-bit and wrap around, so the bounds in #[requires] matter:
# delete one and \`til prove\` shows an input that breaks the contract.

#[requires: lo <= hi]
#[ensures: lo <= result and result <= hi]
clamp(x: int, lo: int, hi: int) -> int
    if x < lo
        return lo
    elif x > hi
        return hi
    return x

#[requires: a >= 0 and b > 0]
#[ensures: result >= 0 and result <= a]
#[ensures: result * b <= a and a - result * b < b]
divide(a: int, b: int) -> int
    return a / b

# (a + b) / 2 wraps around for large a and b; this version cannot.
# Without \`0 <= a\`, til prove finds inputs (a very negative, b very
# positive) for which b - a does not fit in 64 bits.
#[requires: 0 <= a and a <= b]
#[ensures: a <= result and result <= b]
midpoint(a: int, b: int) -> int
    return a + (b - a) / 2

# How many pages for \`items\` lines? The call must satisfy divide's
# #[requires], and divide's #[ensures] is all the prover knows about it.
#[requires: 0 <= items and items <= 1000000000]
#[requires: 0 < per_page and per_page <= 1000000000]
#[ensures: result >= 0 and result * per_page >= items]
pages(items: int, per_page: int) -> int
    return divide(items + per_page - 1, per_page)

# 1 + 2 + ... + n: the loop invariant is what makes it provable.
#[level: 4]
#[requires: n >= 0 and n <= 1000000]
#[ensures: 2 * result == n * (n + 1)]
sum_to(n: int) -> int
    var i = 0
    var s = 0
    while i < n
        invariant 0 <= i and i <= n and 2 * s == i * (i + 1)
        i += 1
        s += i
    return s

# Euclid's algorithm: never divides by zero, the result is positive.
#[level: 4]
#[requires: a > 0 and b > 0]
#[ensures: result > 0]
gcd(a: int, b: int) -> int
    var x = a
    var y = b
    while y != 0
        invariant x > 0 and y >= 0
        let t = x % y
        x = y
        y = t
    return x

#[requires: n >= 0 and n <= 100000]
#[ensures: result == n * n]
square_by_odds(n: int) -> int
    var total = 0
    for i in 0..n
        invariant total == i * i
        total += 2 * i + 1
    return total

main()
    print(f"clamp(15, 0, 10) = {clamp(15, 0, 10)}")
    print(f"divide(17, 5) = {divide(17, 5)}")
    print(f"midpoint(9223372036854775800, 9223372036854775806) = {midpoint(9223372036854775800, 9223372036854775806)}")
    print(f"pages(101, 25) = {pages(101, 25)}")
    print(f"sum_to(100) = {sum_to(100)}")
    print(f"gcd(84, 36) = {gcd(84, 36)}")
    var checked = 0
    for n in 0..20
        assert square_by_odds(n) == n * n
        checked += 1
    print(f"square_by_odds: {checked} values tested here, all of them proved by til prove")
`},{id:"energy",tags:["energy"],file:"14_energy.til",source:`# 14_energy.til
# TIL 3.1 - battery saving (docs/TIL_ENERGY.md).
#
# On the TIL VM a program can give the CPU away while it runs: the VM idles
# 1 ms every few hundred steps (a desktop sleeps, a calculator halts until
# its next interrupt). Results never depend on the energy mode - only the
# battery, and how long a CPU-bound loop takes.
#   0 performance   never idle
#   1 balanced      idle 1 ms every 4096 steps
#   2 low           idle 1 ms every 512 steps
# Run: til run --vm examples/14_energy.til

# The program's mode: a pragma before every definition (followed by an empty line)
#[energy: balanced]

let MODES = ["performance", "balanced", "low"]

# A background job: while it runs the VM behaves as in mode low
#[energy: low]
checksum(n: int) -> int
    var h = 17
    for i in 0..n
        h = (h * 31 + i) % 1000003
    return h

# A short burst at full speed: energy_mode(m) returns the previous mode
count_primes(limit: int) -> int
    let saved = energy_mode(0)
    var count = 0
    for n in 2..limit
        var d = 2
        var prime = true
        while d * d <= n
            if n % d == 0
                prime = false
                break
            d += 1
        if prime
            count += 1
    energy_mode(saved)
    return count

main()
    print(f"mode at start: {MODES[energy_mode()]}")
    print(f"checksum: {checksum(20000)}")
    print(f"primes below 5000: {count_primes(5000)}")
    print(f"mode after the burst: {MODES[energy_mode()]}")
    let before = energy_mode(2)
    print(f"switched from {MODES[before]} to {MODES[energy_mode()]}")
    var total = 0
    for i in 0..3000
        total += i % 10
    print(f"total: {total}")
    let r = retry(1)
        energy_mode(3)
    else
        "refused: " + error
    print(r)
